<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="MCP Demo: A CLI chatbot showing MCP end to end: a live server exposing tools, resources and prompts, and Claude deciding when to use them.">
<title>MCP Demo: A CLI chatbot showing MCP end to end: a live server exposing tools, resources and prompts, and Claude deciding when to use them.</title>
<style>
.idx { font: 700 14px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; fill: #f2ede4; letter-spacing: 2px; }
.tag { font: 600 12px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; fill: #575552; letter-spacing: 2.5px; }
.name { font: 800 34px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #f2ede4; letter-spacing: -.5px; }
.blurb { font: 400 16px 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; fill: #85827d; }
.chip { font: 600 12.5px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; fill: #c2beb6; }
.cta { font: 700 13px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; fill: #f2ede4; letter-spacing: 1px; }
.in { animation: in .9s cubic-bezier(.2,.8,.2,1) both; }
.spin { animation: spin 3s linear infinite; transform-box: view-box; transform-origin: 520px 74px; }
.slow { animation-duration: 12s; }
.ping { animation: ping 3s ease-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
.grow { animation: grow 2.4s cubic-bezier(.6,0,.2,1) infinite alternate; transform-box: fill-box; transform-origin: bottom; }
.beat { animation: beat 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scrub { stroke-dasharray: 68; animation: scrub 4s linear infinite; }
.flow { stroke-dasharray: 30 70; animation: flow 1.6s linear infinite; }
.sheen { animation: sheen 6s ease-in-out infinite; }
.arrow { animation: nudge 1.6s ease-in-out infinite; }
@keyframes in { from { opacity: 0; transform: translateY(10px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ping { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(4.5); } }
@keyframes grow { from { transform: scaleY(.25); } }
@keyframes beat { 50% { transform: scale(1.18); } }
@keyframes scrub { from { stroke-dashoffset: 68; } to { stroke-dashoffset: 0; } }
@keyframes flow { to { stroke-dashoffset: -100; } }
@keyframes sheen { 0%, 60% { transform: translateX(-700px); } 100% { transform: translateX(700px); } }
@keyframes nudge { 50% { transform: translate(3px, -3px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}</style>

<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f2ede4"/><stop offset=".45" stop-color="#f2ede4" stop-opacity=".05"/>
    <stop offset=".55" stop-color="#f2ede4" stop-opacity=".05"/><stop offset="1" stop-color="#f2ede4"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#f2ede4" stop-opacity=".10"/><stop offset=".6" stop-color="#f2ede4" stop-opacity="0"/></radialGradient>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="cc"><rect x="1" y="1" width="598" height="298" rx="20"/></clipPath>
</defs>
<g clip-path="url(#cc)">
  <rect width="600" height="300" fill="#000000"/>
  <rect width="600" height="300" fill="url(#glow)"/>
  <rect x="0" y="0" width="260" height="300" fill="url(#sh)" class="sheen" transform="skewX(-20)"/>
</g>
<rect x="1" y="1" width="598" height="298" rx="20" fill="none" stroke="url(#edge)" stroke-width="2"/>
<text x="36" y="52" class="idx">06</text>
<text x="72" y="52" class="tag">MODEL CONTEXT PROTOCOL</text>
<text x="36" y="114" class="name in">MCP Demo</text>
<text x="36" y="158" class="blurb in" style="animation-delay:.25s">A CLI chatbot showing MCP end to end: a live server exposing</text><text x="36" y="182" class="blurb in" style="animation-delay:.25s">tools, resources and prompts, and Claude deciding when to</text><text x="36" y="206" class="blurb in" style="animation-delay:.25s">use them.</text>
<rect x="36" y="240" width="71" height="28" rx="14" fill="#111110" stroke="#2c2b29"/><text x="71.4" y="259" text-anchor="middle" class="chip">Python</text><rect x="114.8" y="240" width="47" height="28" rx="14" fill="#111110" stroke="#2c2b29"/><text x="138.5" y="259" text-anchor="middle" class="chip">MCP</text><rect x="170.2" y="240" width="71" height="28" rx="14" fill="#111110" stroke="#2c2b29"/><text x="205.6" y="259" text-anchor="middle" class="chip">Claude</text><rect x="249.0" y="240" width="47" height="28" rx="14" fill="#111110" stroke="#2c2b29"/><text x="272.7" y="259" text-anchor="middle" class="chip">CLI</text>
<text x="542" y="259" text-anchor="end" class="cta">VIEW REPO</text>
<text x="550" y="260" class="cta arrow">↗</text>
<line x1="490" y1="74" x2="550" y2="52" stroke="#f2ede4" stroke-width="2" pathLength="100" class="flow" style="animation-delay:0.0s"/><line x1="490" y1="74" x2="550" y2="74" stroke="#f2ede4" stroke-width="2" pathLength="100" class="flow" style="animation-delay:0.4s"/><line x1="490" y1="74" x2="550" y2="96" stroke="#f2ede4" stroke-width="2" pathLength="100" class="flow" style="animation-delay:0.8s"/><circle cx="490" cy="74" r="8" fill="#000000" stroke="#f2ede4" stroke-width="2.5"/><circle cx="550" cy="52" r="5.5" fill="#000000" stroke="#f2ede4" stroke-width="2.5"/><circle cx="550" cy="74" r="5.5" fill="#000000" stroke="#f2ede4" stroke-width="2.5"/><circle cx="550" cy="96" r="5.5" fill="#000000" stroke="#f2ede4" stroke-width="2.5"/>
</svg>
