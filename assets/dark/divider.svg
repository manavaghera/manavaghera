<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-label="divider">
<title>divider</title>
<style>
.run { stroke-dasharray: 14 186; animation: run 3.2s linear infinite; }
.gem { transform: rotate(45deg); animation: gem 3.2s ease-in-out infinite; }
@keyframes run { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
@keyframes gem { 50% { transform: rotate(135deg) scale(1.3); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}</style>

<defs><linearGradient id="dl" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="1160" y2="0"><stop offset="0" stop-color="#f2ede4" stop-opacity="0"/>
<stop offset=".5" stop-color="#f2ede4" stop-opacity=".35"/><stop offset="1" stop-color="#f2ede4" stop-opacity="0"/></linearGradient></defs>
<line x1="40" y1="18" x2="1160" y2="18" stroke="url(#dl)" stroke-width="1"/>
<line x1="40" y1="18" x2="1160" y2="18" stroke="#f2ede4" stroke-width="2" pathLength="200" class="run" stroke-linecap="round"/>
<g transform="translate(600.0 18)"><rect x="-6" y="-6" width="12" height="12" fill="#000000" stroke="#f2ede4" stroke-width="1.5" class="gem"/></g>
</svg>
